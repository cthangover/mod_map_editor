tools/map_editor/title = 地图编辑器
tools/map_editor/hint = 左键——选择 / 拖动 · 右键——删除顶点 · 双击、Enter 或 Esc——完成区域 · Del——删除区域 · Ctrl+S——保存
tools/map_editor/reload_map = 刷新游戏内地图
tools/map_editor/reload_map_tip = 在运行中的游戏里重新读取已保存的地图文件
tools/map_editor/reloaded = 游戏内地图已刷新。
tools/map_editor/select_mode = 选择
tools/map_editor/draw_region = 绘制
tools/map_editor/draw_started = 点击地图放置顶点。双击、Enter 或 Esc 完成，右键删除最后一个。
tools/map_editor/background = 预览背景
tools/map_editor/zones = 区域
tools/map_editor/add_region = + 区域
tools/map_editor/add_region_tip = 新区域：点击地图绘制多边形
tools/map_editor/add_marker = + 标记
tools/map_editor/add_label = + 文字标签
tools/map_editor/delete = 删除区域
tools/map_editor/delete_tip = 删除选中的区域（Del）
tools/map_editor/delete_confirm = 删除选中的区域？保存时更改会写入文件。
tools/map_editor/deleted = 区域"{0}"已删除。
tools/map_editor/props = 区域属性
tools/map_editor/zone_missing = 在列表或地图上选择一个区域。
tools/map_editor/id = ID
tools/map_editor/id_empty = 区域 ID 不能为空。
tools/map_editor/duplicate_id = 区域 ID 已被使用：
tools/map_editor/title_key = 标题
tools/map_editor/description = 描述
tools/map_editor/no_translation = 在本地化中找不到该键
tools/map_editor/scene = 场景
tools/map_editor/scene_none = （无）
tools/map_editor/availability = 可用性
tools/map_editor/locked = 禁止前往
tools/map_editor/hidden = 在地图上隐藏
tools/map_editor/effective = 游戏中：
tools/map_editor/effective_open = 开放
tools/map_editor/effective_locked = 锁定（Locked 标志）
tools/map_editor/effective_no_scene = 锁定（没有场景）
tools/map_editor/effective_unknown_scene = 锁定（找不到场景）
tools/map_editor/effective_hidden = 在地图上隐藏
tools/map_editor/marker = 标记
tools/map_editor/image = 图标
tools/map_editor/image_placeholder = 纹理 ID
tools/map_editor/icon_search = 查找图标…
tools/map_editor/label_section = 文字标签
tools/map_editor/label = 地图上的文字标签
tools/map_editor/x = X（0–1）
tools/map_editor/y = Y（0–1）
tools/map_editor/vertices = 多边形顶点
tools/map_editor/vertices_hint = 在地图上拖动顶点；右键点击顶点将其删除。
tools/map_editor/add_vertex = + 顶点
tools/map_editor/delete_vertex = 删除顶点
tools/map_editor/preview = ▶ 游戏中效果
tools/map_editor/preview_tip = 以游戏中的样子查看地图：悬停、区域卡片、标记（包括未保存的修改）
tools/map_editor/preview_on = 预览：Esc 或 ✕ 返回编辑器。
tools/map_editor/preview_off = 编辑模式。
tools/map_editor/preview_missing = 无法加载地图场景（map_widget.tscn）。
