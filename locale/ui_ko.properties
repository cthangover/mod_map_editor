tools/map_editor/title = 맵 에디터
tools/map_editor/hint = 좌클릭 — 선택 / 드래그 · 우클릭 — 꼭짓점 삭제 · 더블클릭, Enter 또는 Esc — 영역 완성 · Del — 구역 삭제 · Ctrl+S — 저장
tools/map_editor/reload_map = 게임 내 지도 새로 고침
tools/map_editor/reload_map_tip = 실행 중인 게임에서 저장된 지도 파일을 다시 읽습니다
tools/map_editor/reloaded = 게임 내 지도를 새로 고쳤습니다.
tools/map_editor/select_mode = 선택
tools/map_editor/draw_region = 그리기
tools/map_editor/draw_started = 지도를 클릭해 꼭짓점을 놓으세요. 더블클릭, Enter 또는 Esc로 완성, 우클릭으로 마지막 꼭짓점을 지웁니다.
tools/map_editor/background = 미리 보기 배경
tools/map_editor/zones = 구역
tools/map_editor/add_region = + 영역
tools/map_editor/add_region_tip = 새 영역: 지도를 클릭해 다각형을 그립니다
