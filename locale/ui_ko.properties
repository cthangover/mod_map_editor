tools/map_editor/delete_tip = 선택한 구역 삭제 (Del)
tools/map_editor/delete_confirm = 선택한 구역을 삭제할까요? 변경은 저장할 때 파일에 반영됩니다.
tools/map_editor/deleted = 구역 "{0}"을(를) 삭제했습니다.
tools/map_editor/props = 구역 속성
tools/map_editor/zone_missing = 목록이나 지도에서 구역을 고르세요.
tools/map_editor/id = ID
tools/map_editor/id_empty = 구역 ID는 비워 둘 수 없습니다.
tools/map_editor/duplicate_id = 이미 쓰인 구역 ID:
tools/map_editor/title_key = 제목
tools/map_editor/description = 설명
tools/map_editor/no_translation = 로컬라이즈에 키가 없음
tools/map_editor/scene = 장면
tools/map_editor/scene_none = (없음)
tools/map_editor/availability = 이용 여부
tools/map_editor/locked = 이동 불가
tools/map_editor/hidden = 지도에서 숨김
tools/map_editor/effective = 게임에서:
tools/map_editor/effective_open = 열림
tools/map_editor/effective_locked = 잠김 (Locked 플래그)
tools/map_editor/effective_no_scene = 잠김 (장면 없음)
tools/map_editor/effective_unknown_scene = 잠김 (장면을 찾을 수 없음)
tools/map_editor/effective_hidden = 지도에서 숨김
tools/map_editor/marker = 표식
tools/map_editor/image = 아이콘
tools/map_editor/image_placeholder = 텍스처 ID
tools/map_editor/icon_search = 아이콘 찾기…
tools/map_editor/label_section = 라벨
tools/map_editor/label = 지도 위의 텍스트 라벨
tools/map_editor/x = X (0–1)
tools/map_editor/y = Y (0–1)
tools/map_editor/vertices = 다각형 꼭짓점
tools/map_editor/vertices_hint = 지도에서 꼭짓점을 끌어 옮기세요. 꼭짓점을 우클릭하면 삭제됩니다.
tools/map_editor/add_vertex = + 꼭짓점
tools/map_editor/delete_vertex = 꼭짓점 삭제
tools/map_editor/preview = ▶ 게임처럼 보기
tools/map_editor/preview_tip = 게임에서처럼 지도 보기: 호버, 구역 카드, 표식(저장하지 않은 편집 포함)
tools/map_editor/preview_on = 미리 보기: Esc 또는 ✕로 에디터로 돌아갑니다.
tools/map_editor/preview_off = 편집 모드.
tools/map_editor/preview_missing = 지도 장면(map_widget.tscn)을 불러올 수 없습니다.
